        m.albedo *= mix(1.0, 0.45, wetRim);
        if (pMask > 0.01) {
          m.puddleMask = pMask;
          m.rough = mix(m.rough, 0.06, pMask);
          m.albedo = mix(m.albedo, vec3(0.025, 0.04, 0.065), pMask * 0.72);
          float rip = sin(p.x * 9.0 + uTime * 2.6) * cos(p.z * 8.2 - uTime * 2.2);
          float rip2 = sin((p.x - p.z) * 12.0 + uTime * 3.5);
          m.normal = normalize(mix(m.normal, normalize(vec3((rip + rip2 * 0.45) * 0.055, 1.0, (rip - rip2 * 0.45) * 0.055)), pMask));
        }
      }

      // Glowing Cyan-Blue Magic Rune etched into flagstones!
      if (td.g == ${P_RUNE}) {
        float r = length(lp);
        float a = atan(lp.y, lp.x) + uTime * 0.22;
        float ring1 = smoothstep(0.055, 0.012, abs(r - 0.78));
        float ring2 = smoothstep(0.045, 0.012, abs(r - 0.54));
        float hex = smoothstep(0.045, 0.012, abs(r * cos(mod(a, 1.0472) - 0.5236) - 0.44));
        float ticks = smoothstep(0.04, 0.01, abs(r - 0.66)) * smoothstep(0.6, 0.9, sin(a * 12.0));
        float glow = exp(-r * r * 2.2) * 0.42;
        float pulse = 0.78 + 0.22 * sin(uTime * 2.6 + float(td.b) * 0.04);
        float sigil = clamp(ring1 + ring2 + hex * 0.85 + ticks + glow, 0.0, 1.5) * pulse;
        m.emissive += vec3(0.24, 0.76, 1.15) * sigil * 1.35;
      }

      // Iron-Grate Projected Moonlight Pool on Flagstones!
      if (td.g == ${P_MOON}) {
        float r = length(lp);
        float rad = 1.0 - smoothstep(0.32, 1.0, r);
        float bx = smoothstep(0.09, 0.16, abs(fract(lp.x * 1.9 + 0.5) - 0.5));
        float bz = smoothstep(0.09, 0.16, abs(fract(lp.y * 1.9 + 0.5) - 0.5));
        m.emissive += vec3(0.30, 0.54, 0.88) * rad * bx * bz * 0.72;
      }
    }
  } else if (matId == MAT_WOOD) {
    float grain = noise2(vec2(p.x * 6.0 + p.z * 6.0, p.y * 18.0));
    float plank = smoothstep(0.0, 0.08, abs(fract((p.x + p.z) * 2.2) - 0.5));
    m.albedo = vec3(0.30, 0.20, 0.12) * (0.78 + grain * 0.34) * mix(0.65, 1.0, plank);
    m.rough = 0.88;
  } else if (matId == MAT_IRON) {
    m.albedo = vec3(0.21, 0.23, 0.27) * (0.85 + noise2(p.xy * 12.0) * 0.25);
    m.rough = 0.58; m.metal = 0.62;
  } else if (matId == MAT_STEEL) {
    m.albedo = vec3(0.62, 0.67, 0.74);
    m.rough = 0.34; m.metal = 0.78;
  } else if (matId == MAT_GOLD) {
    m.albedo = vec3(0.88, 0.65, 0.22);
    m.emissive = vec3(0.22, 0.13, 0.02);
    m.rough = 0.35; m.metal = 0.78;
  } else if (matId == MAT_BONE) {
    m.albedo = vec3(0.76, 0.71, 0.61) * (0.9 + noise2(p.xy * 10.0) * 0.16);
    m.rough = 0.85;
  } else if (matId == MAT_CLOAK) {
    m.albedo = vec3(0.20, 0.23, 0.29);
    m.rough = 0.94;
  } else if (matId == MAT_ARMOR) {
    m.albedo = vec3(0.36, 0.40, 0.46);
    m.rough = 0.52; m.metal = 0.55;
  } else if (matId == MAT_SKIN) {
    m.albedo = vec3(0.75, 0.56, 0.42);
    m.rough = 0.84;
  } else if (matId == MAT_FLAME) {
    float core = clamp(1.0 - length(N.xz) * 0.55, 0.0, 1.0);
    m.albedo = vec3(1.0, 0.55, 0.15);
    m.emissive = mix(vec3(1.45, 0.52, 0.10), vec3(2.2, 1.75, 0.75), core);
  } else if (matId == MAT_BANNER) {
    // Faded medieval crimson heraldry with ochre trim
    vec2 lp = fract(p.xz * 0.5 + 0.5) - 0.5;
    float side = abs(N.x) > 0.5 ? lp.y : lp.x;
    bool trim = abs(abs(side) - 0.16) < 0.025 || (abs(side) < 0.06 && abs(p.y - 1.85) < 0.10);
    m.albedo = trim ? vec3(0.58, 0.44, 0.22) : vec3(0.42, 0.14, 0.14);
    m.rough = 0.95;
  } else if (matId == MAT_RAT) {
    m.albedo = vec3(0.30, 0.22, 0.19) * (0.85 + noise2(p.xz * 18.0) * 0.25);
    m.rough = 0.92;
  } else if (matId == MAT_SLIME) {
    // Murky emerald-olive translucent gelatin sheen
    m.albedo = vec3(0.26, 0.46, 0.20);
    m.emissive = vec3(0.05, 0.14, 0.03);
    m.rough = 0.24; m.metal = 0.08;
  } else if (matId == MAT_EYE_RED) {
    m.emissive = vec3(2.2, 0.22, 0.18);
  } else if (matId == MAT_EYE_AMB) {
    m.emissive = vec3(2.1, 0.65, 0.16);
  } else if (matId == MAT_EYE_GRN) {
    m.emissive = vec3(1.3, 2.2, 0.35);
  } else if (matId == MAT_POTION) {
    m.albedo = vec3(0.82, 0.16, 0.20);
    m.emissive = vec3(0.42, 0.06, 0.08);
    m.rough = 0.26;
  } else if (matId == MAT_BOSS_CAPE) {
    m.albedo = vec3(0.38, 0.11, 0.13);
    m.rough = 0.94;
  } else if (matId == MAT_STAIR_PIT) {
    m.albedo = vec3(0.02, 0.03, 0.05);
    m.emissive = vec3(0.08, 0.20, 0.36);
  }

  // Hit-flashes & Hero heal glow!
  if (entId == -2.0) {
    if (uHeroState.w > 0.0) m.emissive += vec3(0.85, 0.14, 0.10) * uHeroState.w;
    else if (uHeroState.w < 0.0) m.emissive += vec3(0.55, 0.12, 0.18) * (-uHeroState.w);
  } else if (entId >= 0.0) {
    int mi = int(entId + 0.5);
    float fl = uMob1[mi].z;
    if (fl > 0.0) m.emissive += vec3(1.45, 0.92, 0.55) * fl;
  }

  return m;
}

// Fast 5-tap L1-cached wall occlusion check so sconces/runes don't bleed through stone walls!
float quickWallVis(vec3 p, vec3 lPos) {
  for (int k = 1; k <= 5; k++) {
    vec3 sp = mix(p, lPos, float(k) / 6.0);
    ivec2 tc = ivec2(floor(sp.xz * 0.5 + 0.5));
    int ct = getTile(tc).r;
    if (ct == ${G_BACK_WALL} && sp.y < 2.8) return 0.08;
    if (ct == ${G_CUT_WALL} && sp.y < 0.52) return 0.25;
  }
  return 1.0;
}

// Direct PBR-like point light evaluation (physically calibrated for dark gritty torchlight!)
vec3 evalPointLight(vec3 p, vec3 N, vec3 V, SurfMat m, vec3 lPos, vec3 lCol, float intensity, float shadow) {
  vec3 toL = lPos - p;
  float d = length(toL);
  if (d > 14.5 || intensity <= 0.001) return vec3(0.0);
  vec3 L = toL / d;
  float ndl = max(dot(N, L), 0.0);
  if (ndl <= 0.0 && m.puddleMask <= 0.01) return vec3(0.0);
  float atten = intensity / (1.0 + 0.34 * d + 0.24 * d * d);
  vec3 H = normalize(L + V);
  float specPow = mix(96.0, 12.0, m.rough);
  float spec = pow(max(dot(N, H), 0.0), specPow) * mix(0.75, 0.04, m.rough);
  vec3 diff = m.albedo * ndl * (1.0 - m.metal * 0.65);
  vec3 specCol = mix(vec3(1.0), m.albedo, m.metal) * spec;
  return lCol * atten * (diff + specCol) * shadow;
}

// Direct surface lighting (non-recursive so puddle reflections can call it safely in GLSL!)
vec3 shadeDirect(vec3 p, vec3 N, vec3 V, int matId, float entId, bool doShadow, out SurfMat outMat) {
  SurfMat m = evalMaterial(p, N, matId, entId);
  outMat = m;
  if (matId == MAT_FLAME || matId == MAT_EYE_RED || matId == MAT_EYE_AMB || matId == MAT_EYE_GRN) {
    return m.emissive;
  }

  // Deep cold desaturated blue-grey ambient so unlit stone falls into moody shadow while showing every shape!
  vec3 skyAmb = vec3(0.16 + uDepthTint * 0.05, 0.23, 0.36 + uDepthTint * 0.05) * 0.24;
  vec3 gndAmb = vec3(0.05, 0.08, 0.13) * 0.22;
  vec3 col = m.albedo * mix(gndAmb, skyAmb, N.y * 0.5 + 0.5);
  vec3 rimDir = normalize(vec3(-0.55, 0.78, -0.42));
  col += m.albedo * vec3(0.24, 0.36, 0.54) * max(dot(N, rimDir), 0.0) * 0.14;

  // Crisp crevice AO on stone masonry & floor corners
  if (doShadow && matId != MAT_CAP) {
    float aoD = mapStatic(p + N * 0.20, false).x;
    col *= clamp(aoD / 0.20, 0.38, 1.0);
  }

  // Primary Hero Torch Light with REAL RAYMARCHED SOFT SHADOWS! (THE STAR!)
  float shadow = 1.0;
  if (doShadow && entId != -2.0) {
    int skipM = (entId >= 0.0) ? int(entId + 0.5) : -1;
    shadow = calcSoftShadow(p + N * 0.03, uHeroLightPos, skipM);
  }
  col += evalPointLight(p, N, V, m, uHeroLightPos, uHeroLightCol, 4.9, shadow);

  // Pooled Warm Wall Sconces & Braziers (wall-occluded so rooms stay distinct!)
  for (int i = 0; i < ${MAX_WARM_LIGHTS}; i++) {
    if (uWarmPos[i].w > 0.01) {
      float vis = doShadow ? quickWallVis(p + N * 0.06, uWarmPos[i].xyz) : 1.0;
      col += evalPointLight(p, N, V, m, uWarmPos[i].xyz, uWarmCol[i].rgb, uWarmPos[i].w, vis);
    }
  }
  // Pooled Cold Cyan-Blue Accents (Magic Runes, Moonlight Grates, Stairs Mist)
  for (int i = 0; i < ${MAX_COLD_LIGHTS}; i++) {
    if (uColdPos[i].w > 0.01) {
      float vis = doShadow ? quickWallVis(p + N * 0.06, uColdPos[i].xyz) : 1.0;
      col += evalPointLight(p, N, V, m, uColdPos[i].xyz, uColdCol[i].rgb, uColdPos[i].w, vis);
    }
  }

  col += m.emissive;
  return col;
}

// Primary surface shade + TRUE RAYMARCHED MIRROR REFLECTION IN WET FLAGSTONE PUDDLES!
vec3 shadePoint(vec3 p, vec3 N, vec3 V, int matId, float entId) {
  SurfMat m;
  vec3 col = shadeDirect(p, N, V, matId, entId, true, m);

  if (m.puddleMask > 0.02) {
    vec3 rDir = reflect(-V, m.normal);
    vec3 rOrig = p + vec3(0.0, 0.04, 0.0);
    vec3 rCol = vec3(0.02, 0.032, 0.055);
    float rt = 0.08;
    for (int k = 0; k < 14; k++) {
      vec3 rp = rOrig + rDir * rt;
      vec2 rs = mapStatic(rp, true);
      if (rs.x < 0.02) {
        vec3 rN = normalize(vec3(
          mapStatic(rp + vec3(0.02,0,0), false).x - mapStatic(rp - vec3(0.02,0,0), false).x,
          mapStatic(rp + vec3(0,0.02,0), false).x - mapStatic(rp - vec3(0,0.02,0), false).x,
          mapStatic(rp + vec3(0,0,0.02), false).x - mapStatic(rp - vec3(0,0,0.02), false).x
        ));
        SurfMat dummyM;
        rCol = shadeDirect(rp, rN, -rDir, int(rs.y + 0.5), -1.0, false, dummyM);
        break;
      }
      rt += clamp(rs.x, 0.05, 0.45);
      if (rt > 4.2 || rp.y > 3.2) break;
    }
    // Crisp specular firelight shimmer dancing in puddle
    vec2 dh = p.xz - uHeroLightPos.xz;
    float ripShimmer = smoothstep(0.25, 0.88, 0.5 + 0.5 * sin(p.x * 12.0 + uTime * 5.0) * cos(p.z * 11.0 - uTime * 4.3));
    rCol += uHeroLightCol * exp(-dot(dh, dh) * 0.72) * (0.18 + 0.42 * ripShimmer);
    col = mix(col, rCol, m.puddleMask * 0.58);
  }

  return col;
}

void main() {
  // True Isometric Orthographic Camera Ray Setup
  vec3 F = normalize(vec3(-22.0, -23.5, -22.0));
  vec3 R = normalize(cross(F, vec3(0.0, 1.0, 0.0)));
  vec3 U = cross(R, F);
  vec2 ndc = vUv * 2.0 - 1.0;

  vec3 roBase = uCamTarget - F * 36.0 + R * (ndc.x * uCamZoom * uAspect) + U * (ndc.y * uCamZoom);
  vec3 rd = F;

  // Clip ray analytically to the dungeon height slab (y = 3.25) so ZERO steps are wasted in empty sky!
  float tStart = max(0.0, (3.25 - roBase.y) / rd.y);
  float tMax   = ( -1.15 - roBase.y) / rd.y;

  // Per-Ray Bounding-Sphere Pre-Culling (keeps inner loop blazingly fast at 60 FPS!)
  bool hitHero = hitSphere(roBase, rd, vec3(uHeroPos.x, 0.85, uHeroPos.z), 1.65);

  int mobMask = 0;
  for (int i = 0; i < ${MAX_MOBS}; i++) {
    if (i >= uMobCount) break;
    float rBound = (uMob0[i].w > 2.5) ? 2.1 : 1.05;
    if (hitSphere(roBase, rd, vec3(uMob0[i].x, rBound * 0.75, uMob0[i].y), rBound)) {
      mobMask |= (1 << i);
    }
  }
  int itemMask = 0;
  for (int i = 0; i < ${MAX_ITEMS}; i++) {
    if (i >= uItemCount) break;
    if (hitSphere(roBase, rd, uItems[i].xyz, 0.52)) itemMask |= (1 << i);
  }
  int gibMask = 0;
  for (int i = 0; i < ${MAX_GIBS}; i++) {
    if (i >= uGibCount) break;
    if (hitSphere(roBase, rd, uGibs[i].xyz, 0.32)) gibMask |= (1 << i);
  }

  // Primary Raymarch Loop
  float t = tStart;
  bool hit = false;
  int hitMat = MAT_VOID;
  float hitEnt = -1.0;

  for (int i = 0; i < 64; i++) {
    vec3 p = roBase + rd * t;
    vec3 h = mapScene(p, hitHero, mobMask, itemMask, gibMask, true);
    if (h.x < 0.0045) {
      hit = true;
      hitMat = int(h.y + 0.5);
      hitEnt = h.z;
      break;
    }
    // Step safely without skipping across tile walls
    t += clamp(h.x, 0.006, 0.42);
    if (t > tMax) break;
  }

  vec3 bgCol = vec3(0.008, 0.012, 0.022);
  vec3 col = bgCol;
  float normDepth = 1.0;

  if (hit) {
    vec3 hp = roBase + rd * t;
    vec3 N = calcNormal(hp, hitHero, mobMask, itemMask, gibMask);
    col = shadePoint(hp, N, -rd, hitMat, hitEnt);

    // Subtle distance fog blending far edges into deep blue-grey cavern darkness
    float distFromCamTarget = length(hp.xz - uCamTarget.xz);
    float fog = 1.0 - exp(-distFromCamTarget * distFromCamTarget * 0.0028);
    col = mix(col, bgCol, clamp(fog, 0.0, 0.78));

    // Exact linear orthographic depth in [0, 1] for Depth-Aware Tilt-Shift!
    normDepth = clamp((t - 24.0) / 28.0, 0.0, 1.0);
  } else {
    float tFloor = (0.0 - roBase.y) / rd.y;
    normDepth = clamp((tFloor - 24.0) / 28.0, 0.0, 1.0);
  }

  // ============================================================================
  // VOLUMETRIC & ADDITIVE OVERLAYS (All Pure Shader!)
  // ============================================================================
  float hitT = hit ? t : tMax;

  // 1. Volumetric Moonlight Grate Shafts (analytical ray-cone pass on nearby cold moonlight tiles)
  for (int i = 0; i < ${MAX_COLD_LIGHTS}; i++) {
    if (uColdPos[i].w > 0.5 && uColdPos[i].y > 1.5) {
      // Slanted volumetric moonlight shaft descending onto the floor grate
      vec3 beamBase = vec3(uColdPos[i].x, 0.0, uColdPos[i].z);
      vec3 beamAxis = normalize(vec3(-0.24, 0.94, -0.24));
      float accMoon = 0.0;
      for (int s = 0; s < 6; s++) {
        float st = mix(tStart, hitT, (float(s) + 0.5) / 6.0);
        vec3 sp = roBase + rd * st;
        if (sp.y > 0.05 && sp.y < 3.6) {
          vec3 rel = sp - beamBase;
          float hAlong = dot(rel, beamAxis);
          float rad = length(rel - beamAxis * hAlong);
          float coneR = mix(1.05, 0.58, clamp(sp.y / 3.6, 0.0, 1.0));
          float radial = smoothstep(coneR, coneR * 0.15, rad);
          float vert = smoothstep(0.0, 0.5, sp.y) * smoothstep(3.6, 1.4, sp.y);
          accMoon += radial * vert;
        }
      }
      col += vec3(0.32, 0.56, 0.92) * (accMoon / 6.0) * 0.22;
    }
  }

  // 2. Hero Sword Slash Crescent Arc (translucent steel + torch glint!)
  if (uHeroSwing.z > 0.01) {
    float tPlane = (0.84 - roBase.y) / rd.y;
    if (tPlane > tStart && tPlane < hitT + 0.35) {
      vec3 sp = roBase + rd * tPlane;
      vec2 rel = sp.xz - uHeroPos.xz;
      rel = rot2(-uHeroState.x) * rel;
      float swingSpin = (uHeroSwing.x - 0.45) * 2.2 * uHeroSwing.y;
      rel = rot2(-swingSpin) * rel;
      float r = length(rel);
      float ang = atan(rel.x * uHeroSwing.y, rel.y);
      float outerRim = smoothstep(0.84, 1.66, r) * (1.0 - smoothstep(1.68, 1.78, r));
      float arcFade = smoothstep(-1.45, 0.65, ang) * (1.0 - smoothstep(0.85, 1.55, ang));
      float alpha = uHeroSwing.z * outerRim * arcFade;
      col += mix(vec3(1.1, 0.58, 0.22), vec3(1.6, 1.45, 1.15), outerRim) * alpha;
    }
  }

  // 3. Soft Warm Torch Flame Halos (hero torch + nearby braziers/sconces)
  {
    vec3 oc = uHeroLightPos - roBase;
    float proj = dot(oc, rd);
    if (proj > 0.0 && proj < hitT + 0.8) {
      float d = length(oc - rd * proj);
      col += uHeroLightCol * exp(-d * d * 18.0) * 0.55;
    }
  }

  // 4. Tight Rising Flame Embers & Combat Hit Sparks (zero screen-wide fireflies!)
  for (int i = 0; i < ${MAX_EMBERS}; i++) {
    if (i >= uEmberCount) break;
    vec4 em = uEmbers[i];
    if (em.w <= 0.01) continue;
    vec3 oc = em.xyz - roBase;
    float proj = dot(oc, rd);
    if (proj > 0.0 && proj < hitT + 0.25) {
      float d = length(oc - rd * proj);
      if (d < 0.09) {
        float g = smoothstep(0.075, 0.01, d) * em.w;
        col += uEmberCols[i].rgb * g * 1.45;
      }
    }
  }

  // 5. Crisp Minimal Floating Health Bars (rendered in shader ONLY above hurt monsters!)
  for (int i = 0; i < ${MAX_MOBS}; i++) {
    if (i >= uMobCount) break;
    float hpF = uMob1[i].w;
    if (hpF >= 0.999 || hpF <= 0.0) continue;
    float barY = (uMob0[i].w > 2.5) ? 2.65 : ((uMob0[i].w > 0.5 && uMob0[i].w < 1.5) ? 0.92 : 1.72);
    vec3 bc = vec3(uMob0[i].x, barY, uMob0[i].y);
    vec3 dBar = bc - roBase;
    float proj = dot(dBar, rd);
    if (proj > 0.0 && proj < hitT + 1.5) {
      vec3 perp = dBar - rd * proj;
      float bx = dot(perp, R);
      float by = dot(perp, U);
      float halfW = (uMob0[i].w > 2.5) ? 0.62 : 0.36;
      if (abs(bx) < halfW + 0.04 && abs(by) < 0.068) {
        if (abs(bx) < halfW && abs(by) < 0.038) {
          float fracX = (bx + halfW) / (halfW * 2.0);
          col = (fracX <= hpF) ? vec3(0.85, 0.16, 0.12) : vec3(0.05, 0.04, 0.06);
        } else {
          col = vec3(0.02, 0.025, 0.04);
        }
      }
    }
  }

  // Output linear HDR scene RGB + exact linear orthographic depth in Alpha!
  fragColor = vec4(max(col, vec3(0.0)), normDepth);
}
`;

// Shared CoC calculation for Pass 2 & Pass 3
const TILT_COC_GLSL = `
float getCoC(vec2 uv) {
  float d = texture(uScene, uv).a;
  float depthDiff = abs(d - uFocusDepth);
  float yDist = abs(uv.y - uFocusY);
  // Razor-sharp horizontal focal band through the hero, growing strongly toward top & bottom
  float bandBlur  = smoothstep(0.115, 0.43, yDist);
  float depthBlur = smoothstep(0.032, 0.21, depthDiff);
  float coc = clamp(bandBlur * 0.72 + depthBlur * 0.36 + bandBlur * depthBlur * 0.34, 0.0, 1.0);
  float heroClear = 1.0 - smoothstep(0.085, 0.16, yDist);
  coc *= mix(1.0, smoothstep(0.055, 0.18, depthDiff), heroClear);
  return pow(clamp(coc, 0.0, 1.0), 1.10);
}
`;

// PASS 2: Horizontal Depth-Aware Optical Tilt-Shift Blur (tight continuous step -> ZERO stripe artifacts!)
const BLUR_H_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uScene;
uniform vec2 uLowRes;
uniform float uFocusDepth;
uniform float uFocusY;
${TILT_COC_GLSL}

void main() {
  float cCoC = getCoC(vUv);
  vec4 base = texture(uScene, vUv);
  if (cCoC <= 0.008) {
    fragColor = base;
    return;
  }
  float stepX = (cCoC * 1.85) / uLowRes.x;
  vec3 acc = base.rgb * 1.15;
  float wSum = 1.15;
  for (int i = -6; i <= 6; i++) {
    if (i == 0) continue;
    float fi = float(i);
    float gauss = exp(-(fi * fi) / 14.0);
    vec2 sUv = clamp(vUv + vec2(fi * stepX, 0.0), vec2(0.002), vec2(0.998));
    float sCoC = getCoC(sUv);
    float w = gauss * mix(0.25, 1.0, smoothstep(0.0, cCoC + 0.14, sCoC));
    vec3 sCol = texture(uScene, sUv).rgb;
    float luma = dot(sCol, vec3(0.299, 0.587, 0.114));
    w *= 1.0 + smoothstep(0.55, 1.45, luma) * cCoC * 0.55;
    acc += sCol * w;
    wSum += w;
  }
  fragColor = vec4(acc / wSum, base.a);
}
`;

// PASS 3: Vertical Tilt-Shift + Sharp Focal Band + Filmic sRGB + Subtle Bayer Dither + Vignette + Film Grain
const POST_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uScene;
uniform sampler2D uBlurH;
uniform vec2 uLowRes;
uniform float uFocusDepth;
uniform float uFocusY;
uniform float uTime;
${TILT_COC_GLSL}

// Canonical 8x8 Bayer ordered dither matrix normalized to [0, 1]
float bayer2(vec2 a) {
  vec2 p = mod(floor(a), 2.0);
  return fract(p.x * 0.5 + p.y * 0.75);
}
float bayer8(vec2 p) {
  vec2 f = floor(p);
  return bayer2(f) + bayer2(f * 0.5) * 0.25 + bayer2(f * 0.25) * 0.0625 + (0.5 / 64.0);
}

vec3 toneMapFilmic(vec3 x) {
  x *= 1.05;
  vec3 a = x * (2.51 * x + 0.03);
  vec3 b = x * (2.43 * x + 0.59) + 0.14;
  return clamp(a / b, 0.0, 1.0);
}

void main() {
  // Snap sharp-band UV onto the low-res pixel grid for crafted slightly chunky pixel feel
  vec2 snapUv = (floor(vUv * uLowRes) + 0.5) / uLowRes;
  float centerCoC = getCoC(snapUv);
  vec3 sharpCol = texture(uScene, snapUv).rgb;

  vec3 col = sharpCol;
  if (centerCoC > 0.01) {
    float stepY = (centerCoC * 1.85) / uLowRes.y;
    vec3 acc = texture(uBlurH, vUv).rgb * 1.15;
    float wSum = 1.15;
    for (int i = -6; i <= 6; i++) {
      if (i == 0) continue;
      float fi = float(i);
      float gauss = exp(-(fi * fi) / 14.0);
      vec2 sUv = clamp(vUv + vec2(0.0, fi * stepY), vec2(0.002), vec2(0.998));
      float sCoC = getCoC(sUv);
      float w = gauss * mix(0.25, 1.0, smoothstep(0.0, centerCoC + 0.14, sCoC));
      vec3 sCol = texture(uBlurH, sUv).rgb;
      float lumaLin = dot(sCol, vec3(0.299, 0.587, 0.114));
      w *= 1.0 + smoothstep(0.55, 1.45, lumaLin) * centerCoC * 0.55;
      acc += sCol * w;
      wSum += w;
    }
    vec3 blurCol = acc / wSum;
    col = mix(sharpCol, blurCol, smoothstep(0.01, 0.16, centerCoC));
  }

  // Filmic tone map + proper linear-to-sRGB so shadow shapes stay clearly readable blue-grey
  col = toneMapFilmic(col);
  col = pow(max(col, vec3(0.0)), vec3(1.0 / 2.2));

  // Color grading: cold desaturated blue-grey shadows, warm amber firelight
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  vec3 coolLift = vec3(0.016, 0.025, 0.044) * (1.0 - smoothstep(0.04, 0.34, luma));
  col += coolLift;
  vec3 shadowTint = vec3(0.86, 0.94, 1.14);
  vec3 warmTint   = vec3(1.08, 0.96, 0.84);
  col *= mix(shadowTint, warmTint, smoothstep(0.18, 0.62, luma));

  // SUBTLE Ordered Bayer Dither across many tonal levels (fine gradient texture, NEVER screen-door!)
  float b = bayer8(vUv * uLowRes) - 0.5;
  float levels = 28.0;
  float gradMask = smoothstep(0.04, 0.18, luma) * (1.0 - smoothstep(0.72, 0.98, luma) * 0.55);
  float ditherStrength = 0.60 * gradMask;
  vec3 dithered = floor((col + b * (ditherStrength / levels)) * levels + 0.5) / levels;
  col = mix(col, dithered, 0.66);

  // Soft vignette framing the miniature diorama
  vec2 vc = (vUv - 0.5) * vec2(1.14, 1.02);
  float vig = 1.0 - smoothstep(0.46, 1.08, dot(vc, vc) * 1.26);
  col *= mix(0.52, 1.0, vig);

  // Light animated monochrome film grain
  float grainSeed = dot(floor(gl_FragCoord.xy), vec2(12.9898, 78.233)) + fract(uTime * 17.31) * 43.7;
  float grain = fract(sin(grainSeed) * 43758.5453) - 0.5;
  col += grain * 0.020;

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

// ============================================================================
// 5. PURE WEBGL2 ALL-SHADERS RENDERER + GAME ENGINE
// ============================================================================
class TorchlightDepthsShaderEngine {
  constructor() {
    this.sound = new SoundEngine();
    this.canvas = document.getElementById('gl-canvas');
    const gl = this.canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
    if (!gl) throw new Error('WebGL2 is required to run Torchlight Depths');
    this.gl = gl;

    // Enable Half-Float FBOs for clean HDR torchlight before filmic tone mapping
    this.hasHalfFloat = Boolean(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
    gl.getExtension('OES_texture_float_linear');

    // Compile all 3 shader programs
    this.progRay  = this._createProgram(FULLSCREEN_VS, RAYMARCH_FS);
    this.progBlur = this._createProgram(FULLSCREEN_VS, BLUR_H_FS);
    this.progPost = this._createProgram(FULLSCREEN_VS, POST_FS);

    this.uRay  = this._cacheUniforms(this.progRay, [
      'uMapTex', 'uLowRes', 'uAspect', 'uCamZoom', 'uTime', 'uDepthTint',
      'uCamTarget', 'uHeroPos', 'uHeroState', 'uHeroSwing', 'uHeroLightPos', 'uHeroLightCol',
      'uWarmPos[0]', 'uWarmCol[0]', 'uColdPos[0]', 'uColdCol[0]',
      'uMobCount', 'uMob0[0]', 'uMob1[0]', 'uMob2[0]',
      'uItemCount', 'uItems[0]', 'uGibCount', 'uGibs[0]',
      'uEmberCount', 'uEmbers[0]', 'uEmberCols[0]'
    ]);
    this.uBlur = this._cacheUniforms(this.progBlur, ['uScene', 'uLowRes', 'uFocusDepth', 'uFocusY']);
    this.uPost = this._cacheUniforms(this.progPost, ['uScene', 'uBlurH', 'uLowRes', 'uFocusDepth', 'uFocusY', 'uTime']);

    // Empty VAO for fullscreen triangle draw calls
    this.vao = gl.createVertexArray();

    // Create 36x36 GPU Dungeon Map Data Texture
    this.mapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.mapTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.mapDirty = true;

    // Pre-allocated typed arrays for zero-GC uniform uploads each frame
    this.warmPosBuf = new Float32Array(MAX_WARM_LIGHTS * 4);
    this.warmColBuf = new Float32Array(MAX_WARM_LIGHTS * 4);
    this.coldPosBuf = new Float32Array(MAX_COLD_LIGHTS * 4);
    this.coldColBuf = new Float32Array(MAX_COLD_LIGHTS * 4);
    this.mob0Buf    = new Float32Array(MAX_MOBS * 4);
    this.mob1Buf    = new Float32Array(MAX_MOBS * 4);
    this.mob2Buf    = new Float32Array(MAX_MOBS * 4);
    this.itemBuf    = new Float32Array(MAX_ITEMS * 4);
    this.gibBuf     = new Float32Array(MAX_GIBS * 4);
    this.emberPosBuf = new Float32Array(MAX_EMBERS * 4);
    this.emberColBuf = new Float32Array(MAX_EMBERS * 4);

    // Camera basis (matches GLSL exact constants!)
    const fLen = Math.hypot(22, 23.5, 22);
    this.camF = [-22 / fLen, -23.5 / fLen, -22 / fLen];
    const rLen = Math.SQRT2;
    this.camR = [1 / rLen, 0, -1 / rLen];
    // U = cross(R, F)
    this.camU = [
      this.camR[1] * this.camF[2] - this.camR[2] * this.camF[1],
      this.camR[2] * this.camF[0] - this.camR[0] * this.camF[2],
      this.camR[0] * this.camF[1] - this.camR[1] * this.camF[0]
    ];
    this.camZoom = 8.4;
    this.camTarget = { x: 0, y: 0.55, z: 0 };
    this.camShake = 0;
    this.focusDepth = 0.45;
    this.focusY = 0.50;

    // Render targets
    this.sceneFBO = null;
    this.sceneTex = null;
    this.blurFBO = null;
    this.blurTex = null;
    this.lowW = 640;
    this.lowH = 360;
    this.viewW = window.innerWidth;
    this.viewH = window.innerHeight;
    this._resize();

    // Persistent Hero & Stats
    this.stats = { hp: 12, maxHp: 12, potions: 1, gold: 0, depth: 1, slain: 0, hasKey: false };
    this.hero = {
      x: 0, z: 0, vx: 0, vz: 0, angle: Math.PI * 0.25, radius: 0.36,
      walkPhase: 0, stepSide: 0,
      swingTimer: 0, swingDuration: 0.34, swingCooldown: 0, swingHitDone: false, swingDir: 1,
      flinchTimer: 0, invulnTimer: 0, healGlowTimer: 0, knockX: 0, knockZ: 0
    };
    this.heroLightPos = [0, 1.8, 0];
    this.heroLightCol = [1.0, 0.55, 0.20];

    this.dungeon = null;
    this.monsters = [];
    this.pickups = [];
    this.gibs = [];
    this.embers = Array.from({ length: MAX_EMBERS }, () => ({ x: 0, y: -99, z: 0, vx: 0, vy: 0, vz: 0, life: 0, maxLife: 1, r: 1, g: 0.55, b: 0.15 }));
    this.lurkerTimer = 6;
    this.transitioning = false;

    this.keys = {};
    this.controlMode = 'AUTO';
    this.lastManualTime = -99;
    this.ai = {
      path: [], repathTimer: 0, targetPos: null,
      lastCheckX: 0, lastCheckZ: 0, stuckCheckTimer: 0, stuckCount: 0,
      nudgeAngle: 0, nudgeTimer: 0, strafeSign: 1, strafeTimer: 0
    };

    this.lastTime = performance.now();
    this.elapsed = 0;
    this.toastTimer = 0;

    // HUD refs
    this.elHearts = document.getElementById('hud-hearts');
    this.elPotions = document.getElementById('val-potions');
    this.elKey = document.getElementById('hud-key');
    this.elGold = document.getElementById('val-gold');
    this.elDepth = document.getElementById('val-depth');
    this.elSlain = document.getElementById('val-slain');
    this.elBossWrap = document.getElementById('boss-bar-wrap');
    this.elBossFill = document.getElementById('boss-bar-fill');
    this.elToast = document.getElementById('toast');
    this.elCtrl = document.getElementById('ctrl-hint');
    this.elSoundBtn = document.getElementById('sound-btn');
    this.elSoundLabel = document.getElementById('sound-label');
    this.elFade = document.getElementById('fade-overlay');

    this._bindEvents();
    this._loadLevel(1);
    this._updateHUD();
    this._loop(performance.now());
  }

  _compileShader(type, src) {
    const gl = this.gl;
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error('GLSL Compile Error: ' + gl.getShaderInfoLog(s));
    }
    return s;
  }

  _createProgram(vsSrc, fsSrc) {
    const gl = this.gl;
    const p = gl.createProgram();
    const vs = this._compileShader(gl.VERTEX_SHADER, vsSrc);
    const fs = this._compileShader(gl.FRAGMENT_SHADER, fsSrc);
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('GLSL Link Error: ' + gl.getProgramInfoLog(p));
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return p;
  }

  _cacheUniforms(prog, names) {
    const gl = this.gl;
    const map = {};
    for (const n of names) map[n] = gl.getUniformLocation(prog, n);
    return map;
  }

  _createFBO(w, h, linear) {
    const gl = this.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const intFmt = this.hasHalfFloat ? gl.RGBA16F : gl.RGBA8;
    const type = this.hasHalfFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
    gl.texImage2D(gl.TEXTURE_2D, 0, intFmt, w, h, 0, gl.RGBA, type, null);
    const filt = linear ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo, tex };
  }

  _resize() {
    const gl = this.gl;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.viewW = Math.max(1, window.innerWidth);
    this.viewH = Math.max(1, window.innerHeight);
    this.canvas.width = Math.round(this.viewW * dpr);
    this.canvas.height = Math.round(this.viewH * dpr);
    const aspect = this.viewW / this.viewH;

    // Reduced ~half-resolution raymarching target for crafted pixel look + 60 FPS lock!
    this.lowH = clamp(Math.round(this.viewH * 0.48), 320, 460);
    this.lowW = Math.max(320, Math.round(this.lowH * aspect));

    if (this.sceneFBO) { gl.deleteFramebuffer(this.sceneFBO); gl.deleteTexture(this.sceneTex); }
    if (this.blurFBO)  { gl.deleteFramebuffer(this.blurFBO);  gl.deleteTexture(this.blurTex); }

    const s = this._createFBO(this.lowW, this.lowH, false);
    this.sceneFBO = s.fbo; this.sceneTex = s.tex;
    const b = this._createFBO(this.lowW, this.lowH, true);
    this.blurFBO = b.fbo; this.blurTex = b.tex;
  }

  _bindEvents() {
    window.addEventListener('resize', () => this._resize());
    const markManual = () => {
      this.controlMode = 'MANUAL';
      this.lastManualTime = this.elapsed;
      this._syncCtrlHint();
    };
    window.addEventListener('keydown', (e) => {
      if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
        e.preventDefault();
        this.keys[e.code] = true;
        markManual();
      }
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    this.elSoundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const on = this.sound.toggle();
      this.elSoundBtn.classList.toggle('enabled', on);
      this.elSoundLabel.textContent = on ? 'SOUND ON' : 'SOUND OFF';
    });
  }

  _syncCtrlHint() {
    if (this.controlMode === 'MANUAL') {
      this.elCtrl.textContent = 'MANUAL CONTROL · WASD / ARROWS + SPACE';
      this.elCtrl.classList.add('manual');
    } else {
      this.elCtrl.textContent = 'AUTO-PLAY · WASD / ARROWS + SPACE TO TAKE OVER';
      this.elCtrl.classList.remove('manual');
    }
  }

  _showToast(text, duration = 3.0) {
    this.elToast.textContent = text;
    this.elToast.classList.add('show');
    this.toastTimer = duration;
  }

  _loadLevel(depth) {
    this.stats.depth = depth;
    this.stats.hasKey = false;
    this.monsters = [];
    this.pickups = [];
    this.gibs = [];
    for (const em of this.embers) { em.life = 0; em.y = -99; }
    this.elBossWrap.classList.remove('visible');

    this.dungeon = generateDungeon(depth);
    this.mapDirty = true;

    for (const ms of this.dungeon.monsterSpawns) {
      this._spawnMonster(ms.type, ms.x, ms.z, ms.roomId);
    }

    this.hero.x = this.dungeon.heroStart.x;
    this.hero.z = this.dungeon.heroStart.z;
    this.hero.vx = 0; this.hero.vz = 0;
    this.hero.angle = Math.PI * 0.25;
    this.hero.swingTimer = 0;
    this.hero.invulnTimer = 0.8;

    this.camTarget.x = this.hero.x;
    this.camTarget.z = this.hero.z;

    this.ai.path = [];
    this.ai.repathTimer = 0;
    this.ai.stuckCount = 0;
    this.ai.lastCheckX = this.hero.x;
    this.ai.lastCheckZ = this.hero.z;
    this.lurkerTimer = 7.0;

    const title = DEPTH_TITLES[(depth - 1) % DEPTH_TITLES.length];
    this._showToast(`DEPTH ${depth} — ${title}`, 3.4);
    this._updateHUD();
  }

  _spawnMonster(type, x, z, roomId) {
    const ds = 1 + (this.stats.depth - 1) * 0.14;
    const cfg = {
      rat:      { code: 1, hp: Math.round(16 * ds), speed: 3.15, radius: 0.34, reach: 1.15, dmg: 1, cd: 1.05, gold: [4, 9] },
      slime:    { code: 2, hp: Math.round(24 * ds), speed: 1.95, radius: 0.44, reach: 1.25, dmg: 1, cd: 1.25, gold: [6, 12] },
      skeleton: { code: 0, hp: Math.round(28 * ds), speed: 2.35, radius: 0.38, reach: 1.48, dmg: 1, cd: 1.15, gold: [8, 16] },
      boss:     { code: 3, hp: Math.round(115 * ds), speed: 2.10, radius: 0.62, reach: 2.05, dmg: 2, cd: 1.35, gold: [55, 85] }
    }[type];
    const m = {
      type, code: cfg.code, x, z, vx: 0, vz: 0, angle: rand(0, 6.28),
      hp: cfg.hp, maxHp: cfg.hp, speed: cfg.speed, radius: cfg.radius, reach: cfg.reach,
      dmg: cfg.dmg, atkCd: rand(0.2, 0.7), atkBaseCd: cfg.cd, windup: 0, swingAnim: 0,
      flashTimer: 0, knockX: 0, knockZ: 0, alerted: false, roomId,
      walkPhase: rand(0, 6.28), homeX: x, homeZ: z, wanderTimer: rand(0.5, 2.5),
      wanderAngle: rand(0, 6.28), goldRange: cfg.gold, dead: false
    };
    this.monsters.push(m);
    return m;
  }

  _spawnPickup(kind, x, z, value = 5) {
    this.pickups.push({
      kind, code: kind === 'gold' ? 1 : 2, x, z, value,
      vx: rand(-1.8, 1.8), vy: rand(2.4, 3.8), vz: rand(-1.8, 1.8), y: 0.35, age: 0
    });
  }

  _spawnEmber(x, y, z, r = 1.0, g = 0.52, b = 0.14, burst = false) {
    let slot = -1;
    for (let i = 0; i < MAX_EMBERS; i++) if (this.embers[i].life <= 0) { slot = i; break; }
    if (slot === -1) slot = randInt(0, MAX_EMBERS - 1);
    const e = this.embers[slot];
    e.x = x + rand(-0.07, 0.07);
    e.y = y;
    e.z = z + rand(-0.07, 0.07);
    e.life = burst ? rand(0.22, 0.48) : rand(0.28, 0.62);
    e.maxLife = e.life;
    e.vx = burst ? rand(-2.1, 2.1) : rand(-0.14, 0.14);
    e.vy = burst ? rand(1.1, 3.2) : rand(0.65, 1.2);
    e.vz = burst ? rand(-2.1, 2.1) : rand(-0.14, 0.14);
    e.r = r; e.g = g; e.b = b;
  }

  _spawnDeathBurst(m) {
    const isBoss = m.type === 'boss';
    const count = isBoss ? 12 : (m.type === 'slime' ? 9 : 7);
    const kind = (m.type === 'skeleton' || isBoss) ? 0 : (m.type === 'slime' ? 1 : 2);
    for (let i = 0; i < count; i++) {
      if (this.gibs.length >= MAX_GIBS) this.gibs.shift();
      this.gibs.push({
        x: m.x + rand(-0.2, 0.2), y: rand(0.3, 0.85), z: m.z + rand(-0.2, 0.2),
        vx: rand(-3.2, 3.2), vy: rand(2.0, isBoss ? 5.6 : 4.2), vz: rand(-3.2, 3.2),
        kind, scale: rand(0.65, 0.98), life: rand(5.5, 9.0)
      });
    }
    for (let i = 0; i < (isBoss ? 14 : 6); i++) {
      if (m.type === 'slime') this._spawnEmber(m.x, 0.55, m.z, 0.52, 0.90, 0.30, true);
      else if (isBoss) this._spawnEmber(m.x, 0.85, m.z, 1.0, 0.35, 0.15, true);
      else this._spawnEmber(m.x, 0.55, m.z, 0.95, 0.82, 0.62, true);
    }
  }

  // Solid collision resolution (nothing passes through walls, pillars or monsters!)
  _resolveStaticCollision(entity) {
    const d = this.dungeon;
    const r = entity.radius, half = TILE * 0.5;
    for (let pass = 0; pass < 3; pass++) {
      const cgx = Math.round(entity.x / TILE), cgz = Math.round(entity.z / TILE);
      for (let gz = cgz - 1; gz <= cgz + 1; gz++) {
        for (let gx = cgx - 1; gx <= cgx + 1; gx++) {
          if (gx < 0 || gz < 0 || gx >= GRID_W || gz >= GRID_H) continue;
          const cell = d.grid[gz][gx];
          let solid = (cell === CELL_VOID || cell === CELL_WALL || cell === CELL_CELL_BARS);
          if (cell === CELL_DOOR || cell === CELL_LOCKED_DOOR) {
            const dr = d.doors.find(o => o.gx === gx && o.gz === gz);
            if (dr && dr.openAmount < 0.72) solid = true;
          }
          if (!solid) continue;
          const minX = gx * TILE - half, maxX = gx * TILE + half;
          const minZ = gz * TILE - half, maxZ = gz * TILE + half;
          const cx = clamp(entity.x, minX, maxX), cz = clamp(entity.z, minZ, maxZ);
          const dx = entity.x - cx, dz = entity.z - cz, dSq = dx * dx + dz * dz;
          if (dSq < r * r) {
            const dist = Math.sqrt(dSq);
            if (dist > 0.0001) { entity.x += (dx / dist) * (r - dist); entity.z += (dz / dist) * (r - dist); }
            else {
              const ox = Math.min(Math.abs(entity.x - minX), Math.abs(maxX - entity.x));
              const oz = Math.min(Math.abs(entity.z - minZ), Math.abs(maxZ - entity.z));
              if (ox < oz) entity.x += (entity.x < gx * TILE ? -1 : 1) * (ox + r);
              else entity.z += (entity.z < gz * TILE ? -1 : 1) * (oz + r);
            }
          }
        }
      }
      for (const c of d.solidColliders) {
        const dx = entity.x - c.x, dz = entity.z - c.z, minD = r + c.r, dSq = dx * dx + dz * dz;
        if (dSq < minD * minD && dSq > 1e-6) {
          const dist = Math.sqrt(dSq);
          entity.x += (dx / dist) * (minD - dist);
          entity.z += (dz / dist) * (minD - dist);
        }
      }
    }
  }

  _resolveActorSeparation() {
    const alive = this.monsters.filter(m => !m.dead);
    for (const m of alive) {
      const dx = m.x - this.hero.x, dz = m.z - this.hero.z;
      const minD = this.hero.radius + m.radius + 0.06, dSq = dx * dx + dz * dz;
      if (dSq < minD * minD && dSq > 1e-6) {
        const dist = Math.sqrt(dSq), ov = minD - dist, nx = dx / dist, nz = dz / dist;
        const hs = m.type === 'boss' ? 0.55 : 0.35;
        this.hero.x -= nx * ov * hs; this.hero.z -= nz * ov * hs;
        m.x += nx * ov * (1 - hs); m.z += nz * ov * (1 - hs);
      }
    }
    for (let i = 0; i < alive.length; i++) {
      for (let j = i + 1; j < alive.length; j++) {
        const a = alive[i], b = alive[j], dx = b.x - a.x, dz = b.z - a.z;
        const minD = a.radius + b.radius + 0.05, dSq = dx * dx + dz * dz;
        if (dSq < minD * minD && dSq > 1e-6) {
          const dist = Math.sqrt(dSq), p = (minD - dist) * 0.5, nx = dx / dist, nz = dz / dist;
          a.x -= nx * p; a.z -= nz * p; b.x += nx * p; b.z += nz * p;
        }
      }
    }
    this._resolveStaticCollision(this.hero);
    for (const m of alive) this._resolveStaticCollision(m);
  }

  _triggerHeroSwing() {
    if (this.hero.swingTimer > 0 || this.hero.swingCooldown > 0) return;
    this.hero.swingTimer = this.hero.swingDuration;
    this.hero.swingCooldown = 0.42;
    this.hero.swingHitDone = false;
    this.hero.swingDir *= -1;
    this.sound.playSwordSwing();
  }

  _drinkPotion() {
    if (this.stats.potions <= 0 || this.stats.hp >= this.stats.maxHp) return;
    this.stats.potions--;
    this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + 6);
    this.hero.healGlowTimer = 0.85;
    this.sound.playPotion();
    for (let i = 0; i < 8; i++) this._spawnEmber(this.hero.x + rand(-0.3, 0.3), 0.7, this.hero.z + rand(-0.3, 0.3), 1.0, 0.28, 0.36, true);
    this._updateHUD();
  }

  _damageHero(dmg, fromX, fromZ) {
    if (this.hero.invulnTimer > 0 || this.transitioning) return;
    this.stats.hp = Math.max(0, this.stats.hp - dmg);
    this.hero.flinchTimer = 0.24;
    this.hero.invulnTimer = 0.62;
    this.camShake = Math.max(this.camShake, 0.16);
    const dx = this.hero.x - fromX, dz = this.hero.z - fromZ, len = Math.hypot(dx, dz) || 1;
    this.hero.knockX += (dx / len) * 5.2; this.hero.knockZ += (dz / len) * 5.2;
    this.sound.playHeroHurt();

    if (this.stats.hp > 0 && this.stats.hp <= 5 && this.stats.potions > 0 && this.controlMode === 'AUTO') {
      this._drinkPotion();
    }
    if (this.stats.hp <= 0) {
      this.stats.hp = this.stats.maxHp;
      this.hero.invulnTimer = 1.6;
      this.hero.healGlowTimer = 1.0;
      this._showToast('TORCHLIGHT REKINDLED — SECOND WIND!', 2.4);
      for (let i = 0; i < 12; i++) this._spawnEmber(this.hero.x, 0.8, this.hero.z, 1.0, 0.65, 0.25, true);
      for (const m of this.monsters) {
        if (m.dead) continue;
        const dist = Math.hypot(m.x - this.hero.x, m.z - this.hero.z);
        if (dist < 4.5 && dist > 0.01) {
          m.knockX += ((m.x - this.hero.x) / dist) * 8.0;
          m.knockZ += ((m.z - this.hero.z) / dist) * 8.0;
        }
      }
    }
    this._updateHUD();
  }

  _resolveHeroSwordHit() {
    const reach = 2.08;
    const fx = Math.sin(this.hero.angle), fz = Math.cos(this.hero.angle);
    const baseDmg = 10 + Math.floor((this.stats.depth - 1) * 1.6);
    for (const m of this.monsters) {
      if (m.dead) continue;
      const dx = m.x - this.hero.x, dz = m.z - this.hero.z, dist = Math.hypot(dx, dz);
      if (dist > reach + m.radius) continue;
      const dot = (dx * fx + dz * fz) / (dist || 1);
      if (dot < 0.15 && dist > 0.95) continue;

      m.hp -= baseDmg;
      m.flashTimer = 0.16;
      m.alerted = true;
      const push = m.type === 'boss' ? 3.2 : 6.8;
      m.knockX += (dx / (dist || 1)) * push;
      m.knockZ += (dz / (dist || 1)) * push;

      for (let i = 0; i < 5; i++) {
        if (m.type === 'slime') this._spawnEmber((this.hero.x + m.x) * 0.5, 0.8, (this.hero.z + m.z) * 0.5, 0.55, 0.95, 0.35, true);
        else this._spawnEmber((this.hero.x + m.x) * 0.5, 0.85, (this.hero.z + m.z) * 0.5, 1.0, 0.80, 0.42, true);
      }

      if (m.hp <= 0) {
        m.dead = true;
        this.stats.slain++;
        this.sound.playHit(m.type, true);
        this.sound.playMonsterCry(m.type, true);
        this._spawnDeathBurst(m);
        this.camShake = Math.max(this.camShake, m.type === 'boss' ? 0.34 : 0.14);

        const coinDrops = m.type === 'boss' ? 5 : randInt(1, 2);
        const totalGold = randInt(m.goldRange[0], m.goldRange[1]);
        for (let c = 0; c < coinDrops; c++) this._spawnPickup('gold', m.x, m.z, Math.max(2, Math.round(totalGold / coinDrops)));
        if (m.type === 'boss' || (this.stats.hp <= 8 && this.stats.potions < 2 && Math.random() < 0.35)) {
          this._spawnPickup('potion', m.x, m.z, 1);
        }
        if (m.type === 'boss') {
          this._showToast('THE BONE WARDEN FALLS! KEY DROPPED!', 2.6);
          this.elBossWrap.classList.remove('visible');
          if (this.dungeon.keyItem.guardedByBoss && !this.dungeon.keyItem.collected) {
            this.dungeon.keyItem.guardedByBoss = false;
            this.dungeon.keyItem.x = m.x; this.dungeon.keyItem.z = m.z;
            const ks = this.dungeon.warmSources.find(s => s.isKey);
            if (ks) { ks.x = m.x; ks.z = m.z; }
          }
        }
        this._updateHUD();
      } else {
        this.sound.playHit(m.type, false);
        if (Math.random() < 0.38) this.sound.playMonsterCry(m.type, false);
        this.camShake = Math.max(this.camShake, 0.08);
      }
    }
  }

  _pollManualInput() {
    let sx = 0, sy = 0, attack = false;
    if (this.keys.KeyW || this.keys.ArrowUp) sy -= 1;
    if (this.keys.KeyS || this.keys.ArrowDown) sy += 1;
    if (this.keys.KeyA || this.keys.ArrowLeft) sx -= 1;
    if (this.keys.KeyD || this.keys.ArrowRight) sx += 1;
    if (this.keys.Space) attack = true;

    if (navigator.getGamepads) {
      for (const pad of navigator.getGamepads()) {
        if (!pad) continue;
        const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
        if (Math.hypot(ax, ay) > 0.22) {
          sx += ax; sy += ay;
          this.controlMode = 'MANUAL'; this.lastManualTime = this.elapsed; this._syncCtrlHint();
        }
        if (pad.buttons[0]?.pressed || pad.buttons[2]?.pressed || pad.buttons[5]?.pressed || pad.buttons[7]?.pressed) {
          attack = true; this.controlMode = 'MANUAL'; this.lastManualTime = this.elapsed; this._syncCtrlHint();
        }
        if (pad.buttons[1]?.pressed || pad.buttons[3]?.pressed) this._drinkPotion();
      }
    }

    let mx = 0, mz = 0;
    if (sx !== 0 || sy !== 0 || attack) {
      this.lastManualTime = this.elapsed;
      if (sx !== 0 || sy !== 0) {
        const len = Math.hypot(sx, sy) || 1, nx = sx / len, ny = sy / len;
        mx = (nx + ny) * 0.7071;
        mz = (-nx + ny) * 0.7071;
      }
    }
    if (this.controlMode === 'MANUAL' && (this.elapsed - this.lastManualTime > 4.0)) {
      this.controlMode = 'AUTO';
      this.ai.path = []; this.ai.repathTimer = 0;
      this._syncCtrlHint();
    }
    return { mx, mz, attack };
  }

  _computeAutoAI(dt) {
    const d = this.dungeon, h = this.hero;
    const cgx = clamp(Math.round(h.x / TILE), 0, GRID_W - 1), cgz = clamp(Math.round(h.z / TILE), 0, GRID_H - 1);
    const curRoom = d.roomMap[cgz][cgx];
    if (curRoom >= 0) d.rooms[curRoom].visited = true;

    if (this.stats.hp <= 6 && this.stats.potions > 0) this._drinkPotion();

    let nearestThreat = null, nearestDist = Infinity;
    for (const m of this.monsters) {
      if (m.dead) continue;
      if (!this.stats.hasKey && m.roomId === d.exitRoomId) continue;
      const dist = Math.hypot(m.x - h.x, m.z - h.z);
      if (dist < nearestDist) { nearestDist = dist; nearestThreat = m; }
    }

    if (nearestThreat && nearestDist < 8.6) {
      const dx = nearestThreat.x - h.x, dz = nearestThreat.z - h.z;
      const strikeDist = nearestThreat.radius + 1.48;
      if (nearestDist <= strikeDist) {
        h.angle += angleDiff(h.angle, Math.atan2(dx, dz)) * Math.min(1, dt * 16);
        this._triggerHeroSwing();
        this.ai.strafeTimer -= dt;
        if (this.ai.strafeTimer <= 0) { this.ai.strafeTimer = rand(0.45, 1.0); this.ai.strafeSign = Math.random() < 0.5 ? 1 : -1; }
        const perpX = -dz / (nearestDist || 1), perpZ = dx / (nearestDist || 1);
        const keep = nearestDist < (nearestThreat.radius + 0.72) ? -0.55 : 0.15;
        return { mx: (dx / (nearestDist || 1)) * keep + perpX * 0.42 * this.ai.strafeSign, mz: (dz / (nearestDist || 1)) * keep + perpZ * 0.42 * this.ai.strafeSign, attack: false };
      }
      this.ai.repathTimer -= dt;
      if (this.ai.repathTimer <= 0 || this.ai.path.length === 0) {
        this.ai.path = findPath(d, h.x, h.z, nearestThreat.x, nearestThreat.z, this.stats.hasKey);
        this.ai.repathTimer = 0.25;
      }
      return this._followPath(dt, nearestThreat.x, nearestThreat.z);
    }

    let nearP = null, nearPD = 5.5;
    for (const p of this.pickups) { const dist = Math.hypot(p.x - h.x, p.z - h.z); if (dist < nearPD) { nearPD = dist; nearP = p; } }
    if (nearP) return this._steerDirectOrPath(dt, nearP.x, nearP.z);

    let nearC = null, nearCD = 7.5;
    for (const ch of d.chests) {
      if (ch.opened || (!this.stats.hasKey && ch.roomId === d.exitRoomId)) continue;
      const dist = Math.hypot(ch.x - h.x, ch.z - h.z);
      if (dist < nearCD) { nearCD = dist; nearC = ch; }
    }
    if (nearC) return this._steerDirectOrPath(dt, nearC.x, nearC.z);

    let goalX = null, goalZ = null;
    const unvisited = d.rooms.filter(r => !r.visited && r.id !== d.exitRoomId);
    const unopened = d.chests.filter(c => !c.opened && (this.stats.hasKey || c.roomId !== d.exitRoomId));

    if (!this.stats.hasKey) {
      if (unvisited.length > 0) {
        unvisited.sort((a, b) => Math.hypot(a.cx * TILE - h.x, a.cz * TILE - h.z) - Math.hypot(b.cx * TILE - h.x, b.cz * TILE - h.z));
        goalX = unvisited[0].cx * TILE; goalZ = unvisited[0].cz * TILE;
      } else if (!d.keyItem.collected) {
        if (d.keyItem.guardedByBoss) {
          const boss = this.monsters.find(m => !m.dead && m.type === 'boss');
          goalX = boss ? boss.x : d.keyItem.x; goalZ = boss ? boss.z : d.keyItem.z;
        } else { goalX = d.keyItem.x; goalZ = d.keyItem.z; }
      }
    } else {
      if (unvisited.length > 0 && unvisited.length <= 2) {
        unvisited.sort((a, b) => Math.hypot(a.cx * TILE - h.x, a.cz * TILE - h.z) - Math.hypot(b.cx * TILE - h.x, b.cz * TILE - h.z));
        goalX = unvisited[0].cx * TILE; goalZ = unvisited[0].cz * TILE;
      } else if (unopened.length > 0 && Math.hypot(unopened[0].x - h.x, unopened[0].z - h.z) < 12) {
        goalX = unopened[0].x; goalZ = unopened[0].z;
      } else {
        goalX = d.stairsTile.gx * TILE; goalZ = d.stairsTile.gz * TILE;
      }
    }
    if (goalX === null) {
      goalX = this.stats.hasKey ? d.stairsTile.gx * TILE : d.keyItem.x;
      goalZ = this.stats.hasKey ? d.stairsTile.gz * TILE : d.keyItem.z;
    }
    if (!d.keyItem.collected && !d.keyItem.guardedByBoss && Math.hypot(d.keyItem.x - h.x, d.keyItem.z - h.z) < 7.0) {
      goalX = d.keyItem.x; goalZ = d.keyItem.z;
    }
    return this._steerDirectOrPath(dt, goalX, goalZ);
  }

  _steerDirectOrPath(dt, tx, tz) {
    this.ai.repathTimer -= dt;
    const changed = !this.ai.targetPos || Math.hypot(this.ai.targetPos.x - tx, this.ai.targetPos.z - tz) > 1.2;
    if (this.ai.repathTimer <= 0 || this.ai.path.length === 0 || changed) {
      this.ai.targetPos = { x: tx, z: tz };
      this.ai.path = findPath(this.dungeon, this.hero.x, this.hero.z, tx, tz, this.stats.hasKey);
      this.ai.repathTimer = 0.42;
    }
    return this._followPath(dt, tx, tz);
  }

  _followPath(dt, fx, fz) {
    const h = this.hero;
    if (this.ai.nudgeTimer > 0) {
      this.ai.nudgeTimer -= dt;
      return { mx: Math.cos(this.ai.nudgeAngle), mz: Math.sin(this.ai.nudgeAngle), attack: false };
    }
    while (this.ai.path.length > 0 && Math.hypot(this.ai.path[0].x - h.x, this.ai.path[0].z - h.z) < 0.58) {
      this.ai.path.shift();
    }
    const tgt = this.ai.path.length > 0 ? this.ai.path[0] : { x: fx, z: fz };
    const dx = tgt.x - h.x, dz = tgt.z - h.z, dist = Math.hypot(dx, dz);
    if (dist < 0.12) return { mx: 0, mz: 0, attack: false };
    let mx = dx / dist, mz = dz / dist;
    for (const tr of this.dungeon.traps) {
      if (tr.type === 'spikes' && tr.active) {
        if (Math.hypot(tr.x - (h.x + mx * 0.95), tr.z - (h.z + mz * 0.95)) < 0.85 && Math.hypot(tr.x - h.x, tr.z - h.z) > 0.95) {
          mx *= 0.12; mz *= 0.12;
        }
      }
    }
    return { mx, mz, attack: false };
  }

  _updateStuckWatchdog(dt) {
    if (this.controlMode !== 'AUTO' || this.transitioning || this.hero.swingTimer > 0) return;
    this.ai.stuckCheckTimer += dt;
    if (this.ai.stuckCheckTimer >= 0.65) {
      const moved = Math.hypot(this.hero.x - this.ai.lastCheckX, this.hero.z - this.ai.lastCheckZ);
      this.ai.lastCheckX = this.hero.x; this.ai.lastCheckZ = this.hero.z;
      this.ai.stuckCheckTimer = 0;
      if (moved < 0.24) {
        this.ai.stuckCount++;
        for (const dr of this.dungeon.doors) {
          if (!dr.locked && Math.hypot(dr.gx * TILE - this.hero.x, dr.gz * TILE - this.hero.z) < 2.6) {
            dr.open = true; dr.openAmount = 1;
            const idx = (dr.gz * GRID_W + dr.gx) * 4;
            this.dungeon.mapData[idx + 2] = 255;
            this.mapDirty = true;
          }
        }
        this.ai.nudgeAngle = this.hero.angle + (this.ai.stuckCount % 2 === 0 ? Math.PI * 0.65 : -Math.PI * 0.65);
        this.ai.nudgeTimer = 0.28;
        this.ai.path = []; this.ai.repathTimer = 0;
        if (this.ai.stuckCount >= 4) {
          const gx = clamp(Math.round(this.hero.x / TILE), 1, GRID_W - 2), gz = clamp(Math.round(this.hero.z / TILE), 1, GRID_H - 2);
          if (this.dungeon.grid[gz][gx] === CELL_FLOOR) {
            this.hero.x = lerp(this.hero.x, gx * TILE, 0.35);
            this.hero.z = lerp(this.hero.z, gz * TILE, 0.35);
          }
          this.ai.stuckCount = 0;
        }
      } else this.ai.stuckCount = 0;
    }
  }

  _update(dt) {
    this.elapsed += dt;
    const t = this.elapsed;
    if (this.toastTimer > 0) {
      this.toastTimer -= dt;
      if (this.toastTimer <= 0) this.elToast.classList.remove('show');
    }

    const d = this.dungeon, h = this.hero;
    const manual = this._pollManualInput();
    let moveX = 0, moveZ = 0, wantAttack = false;
    if (!this.transitioning) {
      if (this.controlMode === 'MANUAL') { moveX = manual.mx; moveZ = manual.mz; wantAttack = manual.attack; }
      else { const a = this._computeAutoAI(dt); moveX = a.mx; moveZ = a.mz; wantAttack = a.attack; }
    }
    if (wantAttack) this._triggerHeroSwing();

    // Hero movement
    const speed = h.swingTimer > 0 ? 1.85 : 3.95;
    const mag = Math.hypot(moveX, moveZ);
    if (mag > 0.05) {
      const nx = moveX / Math.max(1, mag), nz = moveZ / Math.max(1, mag);
      h.vx = lerp(h.vx, nx * speed, Math.min(1, dt * 13));
      h.vz = lerp(h.vz, nz * speed, Math.min(1, dt * 13));
      if (h.swingTimer <= 0) h.angle += angleDiff(h.angle, Math.atan2(nx, nz)) * Math.min(1, dt * 14);
    } else {
      h.vx = lerp(h.vx, 0, Math.min(1, dt * 14));
      h.vz = lerp(h.vz, 0, Math.min(1, dt * 14));
    }
    h.knockX *= Math.exp(-dt * 11); h.knockZ *= Math.exp(-dt * 11);
    h.x += (h.vx + h.knockX) * dt; h.z += (h.vz + h.knockZ) * dt;
    this._resolveStaticCollision(h);

    if (h.swingCooldown > 0) h.swingCooldown -= dt;
    if (h.invulnTimer > 0) h.invulnTimer -= dt;
    if (h.flinchTimer > 0) h.flinchTimer = Math.max(0, h.flinchTimer - dt);
    if (h.healGlowTimer > 0) h.healGlowTimer = Math.max(0, h.healGlowTimer - dt);

    if (h.swingTimer > 0) {
      h.swingTimer = Math.max(0, h.swingTimer - dt);
      const p = 1 - h.swingTimer / h.swingDuration;
      if (p >= 0.32 && !h.swingHitDone) { h.swingHitDone = true; this._resolveHeroSwordHit(); }
    }

    // Walk cycle & footsteps (with damp splash in puddles!)
    const speedMag = Math.hypot(h.vx, h.vz);
    const movingFrac = clamp(speedMag / 3.8, 0, 1);
    if (movingFrac > 0.1) {
      h.walkPhase += dt * (7.2 + movingFrac * 4.4);
      const sSign = Math.sin(h.walkPhase) >= 0 ? 1 : -1;
      if (sSign !== h.stepSide) {
        h.stepSide = sSign;
        const gx = clamp(Math.round(h.x / TILE), 0, GRID_W - 1), gz = clamp(Math.round(h.z / TILE), 0, GRID_H - 1);
        const inPuddle = (d.mapData[(gz * GRID_W + gx) * 4 + 3] & 1) !== 0;
        this.sound.playFootstep(inPuddle);
      }
    } else h.walkPhase += dt * 1.8;

    // Flickering hero torch world position (exact match to GLSL SDF hero left-hand torch!)
    const flick = Math.sin(t * 14.3) * 0.35 + Math.sin(t * 23.7 + 1.2) * 0.25 + Math.cos(t * 37.1 + 0.5) * 0.15 + Math.sin(t * 7.1) * 0.25;
    const bob = Math.abs(Math.cos(h.walkPhase)) * 0.08 * movingFrac;
    const ca = Math.cos(h.angle), sa = Math.sin(h.angle);
    const lx = -0.34, lz = 0.36;
    const wx = h.x + lx * ca + lz * sa;
    const wz = h.z - lx * sa + lz * ca;
    const wy = 1.66 + bob + Math.sin(h.walkPhase) * 0.07 * movingFrac;
    this.heroLightPos[0] = wx + Math.sin(t * 19.3) * 0.045;
    this.heroLightPos[1] = wy + Math.cos(t * 15.7) * 0.035;
    this.heroLightPos[2] = wz + Math.cos(t * 21.1) * 0.045;
    const flMul = 1.0 + flick * 0.15;
    this.heroLightCol[0] = 1.0 * flMul;
    this.heroLightCol[1] = clamp(0.46 + flick * 0.05, 0.38, 0.58) * flMul;
    this.heroLightCol[2] = clamp(0.14 + flick * 0.03, 0.10, 0.22) * flMul;

    if (Math.random() < dt * 10) this._spawnEmber(wx, wy - 0.08, wz, 1.0, 0.62, 0.20, false);

    // Doors (sync swinging animation into GPU map texture B channel!)
    for (const dr of d.doors) {
      const dx = dr.gx * TILE, dz = dr.gz * TILE;
      if (!dr.open && Math.hypot(dx - h.x, dz - h.z) < 2.25) {
        if (!dr.locked) { dr.open = true; this.sound.playDoorOpen(); }
        else if (this.stats.hasKey) {
          dr.locked = false; dr.open = true;
          const idx = (dr.gz * GRID_W + dr.gx) * 4;
          d.mapData[idx] = dr.horiz ? G_DOOR_H : G_DOOR_V;
          this.mapDirty = true;
          this.sound.playDoorUnlock();
          this._showToast('EXIT DOOR UNLOCKED!', 2.2);
          for (let i = 0; i < 10; i++) this._spawnEmber(dx, 1.1, dz, 1.0, 0.82, 0.36, true);
        }
      }
      if (!dr.open && !dr.locked) {
        for (const m of this.monsters) if (!m.dead && Math.hypot(dx - m.x, dz - m.z) < 1.85) { dr.open = true; break; }
      }
      const prevByte = Math.round(dr.openAmount * 255);
      dr.openAmount = lerp(dr.openAmount, dr.open ? 1 : 0, Math.min(1, dt * 6.5));
      const newByte = Math.round(dr.openAmount * 255);
      if (newByte !== prevByte) {
        d.mapData[(dr.gz * GRID_W + dr.gx) * 4 + 2] = newByte;
        this.mapDirty = true;
      }
    }

    // Treasure Chests (sync animated lid into GPU map texture!)
    for (const ch of d.chests) {
      if (!ch.opened && Math.hypot(ch.x - h.x, ch.z - h.z) < 1.55) {
        ch.opened = true;
        this.sound.playChest();
        const goldAmt = randInt(16, 32) + this.stats.depth * 4;
        this.stats.gold += goldAmt;
        const gotPotion = this.stats.potions < 3 && (this.stats.hp < this.stats.maxHp || Math.random() < 0.65);
        if (gotPotion) this.stats.potions++;
        for (let i = 0; i < 9; i++) {
          if (gotPotion && i % 3 === 0) this._spawnEmber(ch.x, 0.65, ch.z, 1.0, 0.28, 0.36, true);
          else this._spawnEmber(ch.x, 0.65, ch.z, 1.0, 0.85, 0.36, true);
        }
        this._showToast(gotPotion ? `CHEST: +${goldAmt} GOLD & HEALTH POTION` : `CHEST: +${goldAmt} GOLD`, 1.8);
        this._updateHUD();
      }
      if (ch.opened && ch.openAnim < 1) {
        ch.openAnim = Math.min(1, ch.openAnim + dt * 5.0);
        d.mapData[(ch.gz * GRID_W + ch.gx) * 4 + 2] = Math.round(ch.openAnim * 255);
        this.mapDirty = true;
      }
    }

    // Golden Key pickup
    if (!d.keyItem.collected && !d.keyItem.guardedByBoss) {
      if (Math.hypot(d.keyItem.x - h.x, d.keyItem.z - h.z) < 1.15) {
        d.keyItem.collected = true;
        this.stats.hasKey = true;
        this.sound.playKey();
        this._showToast('FOUND THE GOLDEN DUNGEON KEY!', 2.6);
        for (let i = 0; i < 10; i++) this._spawnEmber(d.keyItem.x, 0.75, d.keyItem.z, 1.0, 0.86, 0.40, true);
        this.ai.path = [];
        this._updateHUD();
      }
    }

    // Loose Pickups
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const p = this.pickups[i];
      p.age += dt;
      p.vy -= 14 * dt;
      p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt;
      if (p.y < 0.22) { p.y = 0.22; p.vy *= -0.35; p.vx *= 0.6; p.vz *= 0.6; }
      const dist = Math.hypot(p.x - h.x, p.z - h.z);
      if (p.age > 0.25 && dist < 2.2) { p.x = lerp(p.x, h.x, Math.min(1, dt * 8)); p.z = lerp(p.z, h.z, Math.min(1, dt * 8)); }
      if (p.age > 0.18 && dist < 0.85) {
        if (p.kind === 'gold') { this.stats.gold += p.value; this.sound.playCoin(); }
        else {
          if (this.stats.hp < this.stats.maxHp) { this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + 4); h.healGlowTimer = 0.6; }
          else this.stats.potions = Math.min(4, this.stats.potions + 1);
          this.sound.playPotion();
        }
        this.pickups.splice(i, 1);
        this._updateHUD();
      }
    }

    // Traps (exact same time phase equation as GLSL!)
    for (const tr of d.traps) {
      if (tr.hitCooldown > 0) tr.hitCooldown -= dt;
      if (tr.type === 'spikes') {
        const cyc = (t * 0.9 + tr.phase) % 3.6;
        const was = tr.active;
        tr.active = cyc > 2.25 && cyc < 3.05;
        if (tr.active && !was && Math.hypot(tr.x - h.x, tr.z - h.z) < 10) this.sound.playTrapSnap();
        if (tr.active && tr.hitCooldown <= 0) {
          if (Math.hypot(h.x - tr.x, h.z - tr.z) < 0.78) { this._damageHero(1, tr.x, tr.z); tr.hitCooldown = 0.9; }
          for (const m of this.monsters) {
            if (!m.dead && Math.hypot(m.x - tr.x, m.z - tr.z) < 0.85) {
              m.hp -= 8; m.flashTimer = 0.14; tr.hitCooldown = 0.75;
              if (m.hp <= 0) { m.dead = true; this.stats.slain++; this._spawnDeathBurst(m); this._updateHUD(); }
            }
          }
        }
      } else if (tr.type === 'blade') {
        const swing = Math.sin(t * 2.15 + tr.phase) * 0.82;
        const off = Math.sin(swing) * 2.18;
        const bx = tr.x + (tr.axis === 'x' ? off : 0), bz = tr.z + (tr.axis === 'z' ? off : 0);
        if (Math.abs(swing) < 0.34 && tr.hitCooldown <= 0 && Math.hypot(h.x - bx, h.z - bz) < 0.68) {
          this._damageHero(1, bx, bz); tr.hitCooldown = 0.95;
        }
      }
    }

    // Monsters AI & Combat
    let activeBoss = null;
    for (const m of this.monsters) {
      if (m.dead) continue;
      if (m.type === 'boss') activeBoss = m;
      const dx = h.x - m.x, dz = h.z - m.z, dist = Math.hypot(dx, dz);
      if ((!this.stats.hasKey && m.roomId === d.exitRoomId) ? false : dist < 10.5) m.alerted = true;

      m.knockX *= Math.exp(-dt * 9.5); m.knockZ *= Math.exp(-dt * 9.5);
      if (m.atkCd > 0) m.atkCd -= dt;
      if (m.flashTimer > 0) m.flashTimer = Math.max(0, m.flashTimer - dt);
      if (m.swingAnim > 0) m.swingAnim = Math.max(0, m.swingAnim - dt);

      let mvx = 0, mvz = 0;
      if (m.alerted && dist < 15.0) {
        m.angle += angleDiff(m.angle, Math.atan2(dx, dz)) * Math.min(1, dt * 10);
        if (m.windup > 0) {
          m.windup -= dt;
          if (m.windup <= 0) {
            m.swingAnim = 0.25; m.atkCd = m.atkBaseCd;
            if (dist <= m.reach + h.radius + 0.32) this._damageHero(m.dmg, m.x, m.z);
          }
        } else if (dist <= m.reach && m.atkCd <= 0) {
          m.windup = m.type === 'boss' ? 0.42 : 0.30;
          if (Math.random() < 0.4) this.sound.playMonsterCry(m.type, false);
        } else if (dist > m.reach * 0.84) {
          mvx = (dx / (dist || 1)) * m.speed; mvz = (dz / (dist || 1)) * m.speed;
        }
      } else {
        m.wanderTimer -= dt;
        if (m.wanderTimer <= 0) {
          m.wanderTimer = rand(1.4, 3.2);
          const thx = m.homeX - m.x, thz = m.homeZ - m.z;
          m.wanderAngle = Math.hypot(thx, thz) > 2.8 ? Math.atan2(thx, thz) : rand(0, 6.28);
        }
        mvx = Math.sin(m.wanderAngle) * m.speed * 0.32;
        mvz = Math.cos(m.wanderAngle) * m.speed * 0.32;
        m.angle += angleDiff(m.angle, m.wanderAngle) * Math.min(1, dt * 4);
      }
      m.vx = lerp(m.vx, mvx, Math.min(1, dt * 10));
      m.vz = lerp(m.vz, mvz, Math.min(1, dt * 10));
      m.x += (m.vx + m.knockX) * dt; m.z += (m.vz + m.knockZ) * dt;
      this._resolveStaticCollision(m);
      m.walkPhase += dt * (4.0 + Math.hypot(m.vx, m.vz) * 3.0);
    }

    if (activeBoss && !activeBoss.dead && Math.hypot(activeBoss.x - h.x, activeBoss.z - h.z) < 14) {
      this.elBossWrap.classList.add('visible');
      this.elBossFill.style.width = `${clamp((activeBoss.hp / activeBoss.maxHp) * 100, 0, 100)}%`;
    } else this.elBossWrap.classList.remove('visible');

    this._resolveActorSeparation();

    // Keep combat lively (zero long empty stretches!)
    this.lurkerTimer -= dt;
    if (this.lurkerTimer <= 0 && !this.transitioning) {
      this.lurkerTimer = 5.5;
      const nearby = this.monsters.filter(m => !m.dead && Math.hypot(m.x - h.x, m.z - h.z) < 12.5).length;
      if (nearby === 0 && this.monsters.filter(m => !m.dead).length < 24) {
        const cands = [];
        for (let gz = 2; gz < GRID_H - 2; gz++) for (let gx = 2; gx < GRID_W - 2; gx++) {
          if (d.grid[gz][gx] !== CELL_FLOOR || (!this.stats.hasKey && d.roomMap[gz][gx] === d.exitRoomId)) continue;
          const wx = gx * TILE, wz = gz * TILE, dist = Math.hypot(wx - h.x, wz - h.z);
          if (dist >= 7.5 && dist <= 11.5) cands.push({ x: wx, z: wz, roomId: d.roomMap[gz][gx] });
        }
        if (cands.length > 0) {
          const sp = cands[randInt(0, cands.length - 1)];
          const s = this._spawnMonster(['rat', 'skeleton', 'slime'][randInt(0, 2)], sp.x, sp.z, sp.roomId);
          s.alerted = true;
        }
      }
    }

    // Descend stairs to next deeper level!
    if (!this.transitioning && this.stats.hasKey) {
      if (Math.hypot(h.x - d.stairsTile.gx * TILE, h.z - d.stairsTile.gz * TILE) < 0.95) this._descendToNextLevel();
    }

    // Gibs physics (tumbling bones & bouncing slime goo!)
    for (let i = this.gibs.length - 1; i >= 0; i--) {
      const g = this.gibs[i];
      g.life -= dt; g.vy -= 14.5 * dt;
      g.x += g.vx * dt; g.y += g.vy * dt; g.z += g.vz * dt;
      if (g.y < 0.08) { g.y = 0.08; g.vy *= g.kind === 1 ? -0.18 : -0.36; g.vx *= 0.65; g.vz *= 0.65; }
      if (g.life < 1.2) g.scale = Math.max(0.05, g.scale - dt * 0.7);
      if (g.life <= 0) this.gibs.splice(i, 1);
    }

    // Tight flame embers on nearby sconces/braziers
    for (const fa of d.flameAnchors) {
      if (Math.hypot(fa.x - h.x, fa.z - h.z) < 13 && Math.random() < dt * 2.5) {
        this._spawnEmber(fa.x, fa.y, fa.z, 1.0, 0.56, 0.16, false);
      }
    }
    for (const e of this.embers) {
      if (e.life > 0) {
        e.life -= dt;
        e.x += e.vx * dt; e.y += e.vy * dt; e.z += e.vz * dt;
        e.vy *= Math.exp(-dt * 0.8);
        if (e.life <= 0) e.y = -99;
      }
    }

    // Smooth camera follow + exact orthographic hero focus depth for tilt-shift
    this.camShake = Math.max(0, this.camShake - dt * 1.4);
    this.camTarget.x = lerp(this.camTarget.x, h.x + h.vx * 0.22, Math.min(1, dt * 4.8));
    this.camTarget.z = lerp(this.camTarget.z, h.z + h.vz * 0.22, Math.min(1, dt * 4.8));
    const shX = (Math.random() - 0.5) * this.camShake, shZ = (Math.random() - 0.5) * this.camShake;
    const cx = this.camTarget.x + shX, cy = 0.55, cz = this.camTarget.z + shZ;
    this.renderCamTarget = [cx, cy, cz];

    // Project hero to orthographic ray depth & screen Y
    const ox = cx - this.camF[0] * 36.0, oy = cy - this.camF[1] * 36.0, oz = cz - this.camF[2] * 36.0;
    const rx = h.x - ox, ry = 0.72 - oy, rz = h.z - oz;
    const hDepth = rx * this.camF[0] + ry * this.camF[1] + rz * this.camF[2];
    const hUp = rx * this.camU[0] + ry * this.camU[1] + rz * this.camU[2];
    this.focusDepth = lerp(this.focusDepth, clamp((hDepth - 24.0) / 28.0, 0, 1), Math.min(1, dt * 10));
    this.focusY = lerp(this.focusY, clamp((hUp / this.camZoom) * 0.5 + 0.5, 0.2, 0.8), Math.min(1, dt * 10));

    this.sound.update(dt, 0.5 + flick * 0.5);
    this._updateStuckWatchdog(dt);
  }

  _descendToNextLevel() {
    if (this.transitioning) return;
    this.transitioning = true;
    this.sound.playStairs();
    this._showToast(`DESCENDING TO DEPTH ${this.stats.depth + 1}...`, 1.4);
    this.elFade.classList.add('active');
    setTimeout(() => {
      this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + 4);
      this._loadLevel(this.stats.depth + 1);
      setTimeout(() => { this.elFade.classList.remove('active'); this.transitioning = false; }, 160);
    }, 440);
  }

  _render() {
    const gl = this.gl, d = this.dungeon, h = this.hero, t = this.elapsed;

    // Upload 36x36 dungeon map texture whenever doors/chests/level changed
    if (this.mapDirty) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.mapTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GRID_W, GRID_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, d.mapData);
      this.mapDirty = false;
    }

    // Pack closest warm & cold lights
    const warmSorted = d.warmSources
      .filter(s => !(s.isKey && (d.keyItem.collected || d.keyItem.guardedByBoss)))
      .map(s => ({ s, dSq: (s.x - h.x) ** 2 + (s.z - h.z) ** 2 }))
      .sort((a, b) => a.dSq - b.dSq);
    for (let i = 0; i < MAX_WARM_LIGHTS; i++) {
      const o = i * 4;
      if (i < warmSorted.length && warmSorted[i].dSq < 260) {
        const { s, dSq } = warmSorted[i];
        const fade = clamp(1 - (Math.sqrt(dSq) - 11.5) / 5.2, 0, 1);
        const fl = 0.88 + 0.16 * Math.sin(t * 11.5 + s.phase) + 0.08 * Math.cos(t * 21.3 + s.phase * 1.4);
        this.warmPosBuf[o] = s.x; this.warmPosBuf[o + 1] = s.y; this.warmPosBuf[o + 2] = s.z; this.warmPosBuf[o + 3] = s.intensity * fl * fade;
        this.warmColBuf[o] = s.color[0]; this.warmColBuf[o + 1] = s.color[1]; this.warmColBuf[o + 2] = s.color[2]; this.warmColBuf[o + 3] = s.phase;
      } else this.warmPosBuf[o + 3] = 0;
    }

    const coldSorted = d.coldSources
      .map(s => ({ s, dSq: (s.x - h.x) ** 2 + (s.z - h.z) ** 2 }))
      .sort((a, b) => a.dSq - b.dSq);
    for (let i = 0; i < MAX_COLD_LIGHTS; i++) {
      const o = i * 4;
      if (i < coldSorted.length && coldSorted[i].dSq < 240) {
        const { s, dSq } = coldSorted[i];
        const fade = clamp(1 - (Math.sqrt(dSq) - 11) / 5.0, 0, 1);
        const pulse = 0.85 + 0.18 * Math.sin(t * 2.4 + s.phase);
        this.coldPosBuf[o] = s.x; this.coldPosBuf[o + 1] = s.y; this.coldPosBuf[o + 2] = s.z; this.coldPosBuf[o + 3] = s.intensity * pulse * fade;
        this.coldColBuf[o] = s.color[0]; this.coldColBuf[o + 1] = s.color[1]; this.coldColBuf[o + 2] = s.color[2]; this.coldColBuf[o + 3] = s.phase;
      } else this.coldPosBuf[o + 3] = 0;
    }

    // Pack closest visible monsters
    const mobSorted = this.monsters
      .filter(m => !m.dead && (m.x - this.camTarget.x) ** 2 + (m.z - this.camTarget.z) ** 2 < 240)
      .sort((a, b) => ((a.x - h.x) ** 2 + (a.z - h.z) ** 2) - ((b.x - h.x) ** 2 + (b.z - h.z) ** 2));
    const mobCount = Math.min(MAX_MOBS, mobSorted.length);
    for (let i = 0; i < mobCount; i++) {
      const m = mobSorted[i], o = i * 4;
      this.mob0Buf[o] = m.x; this.mob0Buf[o + 1] = m.z; this.mob0Buf[o + 2] = m.angle; this.mob0Buf[o + 3] = m.code;
      this.mob1Buf[o] = m.walkPhase; this.mob1Buf[o + 1] = m.swingAnim; this.mob1Buf[o + 2] = m.flashTimer / 0.16; this.mob1Buf[o + 3] = clamp(m.hp / m.maxHp, 0, 1);
      this.mob2Buf[o] = m.windup; this.mob2Buf[o + 1] = m.alerted ? 1 : 0; this.mob2Buf[o + 2] = m.radius; this.mob2Buf[o + 3] = 0;
    }

    // Pack Golden Key & loose pickups
    let itemCount = 0;
    if (!d.keyItem.collected && !d.keyItem.guardedByBoss && itemCount < MAX_ITEMS) {
      const o = itemCount++ * 4;
      this.itemBuf[o] = d.keyItem.x; this.itemBuf[o + 1] = 0.68 + Math.sin(t * 3.4) * 0.10; this.itemBuf[o + 2] = d.keyItem.z; this.itemBuf[o + 3] = 0;
    }
    for (const p of this.pickups) {
      if (itemCount >= MAX_ITEMS) break;
      const o = itemCount++ * 4;
      this.itemBuf[o] = p.x; this.itemBuf[o + 1] = p.y + Math.sin(t * 4 + itemCount) * 0.05; this.itemBuf[o + 2] = p.z; this.itemBuf[o + 3] = p.code;
    }

    // Pack death gibs (bones & goo!)
    const gibCount = Math.min(MAX_GIBS, this.gibs.length);
    for (let i = 0; i < gibCount; i++) {
      const g = this.gibs[i], o = i * 4;
      this.gibBuf[o] = g.x; this.gibBuf[o + 1] = g.y; this.gibBuf[o + 2] = g.z; this.gibBuf[o + 3] = g.kind + clamp(g.scale, 0.05, 0.99);
    }

    // Pack flame embers & hit sparks
    let emberCount = 0;
    for (const e of this.embers) {
      if (e.life <= 0) continue;
      const o = emberCount++ * 4;
      this.emberPosBuf[o] = e.x; this.emberPosBuf[o + 1] = e.y; this.emberPosBuf[o + 2] = e.z; this.emberPosBuf[o + 3] = clamp(e.life / e.maxLife, 0, 1);
      this.emberColBuf[o] = e.r; this.emberColBuf[o + 1] = e.g; this.emberColBuf[o + 2] = e.b; this.emberColBuf[o + 3] = 1;
    }

    const movingFrac = clamp(Math.hypot(h.vx, h.vz) / 3.8, 0, 1);
    const bob = Math.abs(Math.cos(h.walkPhase)) * 0.08 * movingFrac;
    const flinchOrHeal = h.flinchTimer > 0 ? (h.flinchTimer / 0.24) : (h.healGlowTimer > 0 ? -(h.healGlowTimer / 0.85) : 0);
    let swingP = -1, slashAlpha = 0;
    if (h.swingTimer > 0) {
      swingP = 1 - h.swingTimer / h.swingDuration;
      if (swingP > 0.22 && swingP < 0.72) slashAlpha = Math.sin(((swingP - 0.22) / 0.50) * Math.PI) * 0.9;
    }

    gl.bindVertexArray(this.vao);

    // ---- PASS 1: FULL 3D SDF RAYMARCH INTO REDUCED-RES HDR FBO ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.sceneFBO);
    gl.viewport(0, 0, this.lowW, this.lowH);
    gl.useProgram(this.progRay);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.mapTex);
    gl.uniform1i(this.uRay.uMapTex, 0);
    gl.uniform2f(this.uRay.uLowRes, this.lowW, this.lowH);
    gl.uniform1f(this.uRay.uAspect, this.viewW / this.viewH);
    gl.uniform1f(this.uRay.uCamZoom, this.camZoom);
    gl.uniform1f(this.uRay.uTime, t);
    gl.uniform1f(this.uRay.uDepthTint, ((this.stats.depth - 1) % 3) * 0.35);

    gl.uniform3fv(this.uRay.uCamTarget, this.renderCamTarget);
    gl.uniform3f(this.uRay.uHeroPos, h.x, bob, h.z);
    gl.uniform4f(this.uRay.uHeroState, h.angle, h.walkPhase, movingFrac, flinchOrHeal);
    gl.uniform4f(this.uRay.uHeroSwing, swingP, h.swingDir, slashAlpha, 0);
    gl.uniform3fv(this.uRay.uHeroLightPos, this.heroLightPos);
    gl.uniform3fv(this.uRay.uHeroLightCol, this.heroLightCol);

    gl.uniform4fv(this.uRay['uWarmPos[0]'], this.warmPosBuf);
    gl.uniform4fv(this.uRay['uWarmCol[0]'], this.warmColBuf);
    gl.uniform4fv(this.uRay['uColdPos[0]'], this.coldPosBuf);
    gl.uniform4fv(this.uRay['uColdCol[0]'], this.coldColBuf);

    gl.uniform1i(this.uRay.uMobCount, mobCount);
    gl.uniform4fv(this.uRay['uMob0[0]'], this.mob0Buf);
    gl.uniform4fv(this.uRay['uMob1[0]'], this.mob1Buf);
    gl.uniform4fv(this.uRay['uMob2[0]'], this.mob2Buf);

    gl.uniform1i(this.uRay.uItemCount, itemCount);
    gl.uniform4fv(this.uRay['uItems[0]'], this.itemBuf);
    gl.uniform1i(this.uRay.uGibCount, gibCount);
    gl.uniform4fv(this.uRay['uGibs[0]'], this.gibBuf);
    gl.uniform1i(this.uRay.uEmberCount, emberCount);
    gl.uniform4fv(this.uRay['uEmbers[0]'], this.emberPosBuf);
    gl.uniform4fv(this.uRay['uEmberCols[0]'], this.emberColBuf);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // ---- PASS 2: HORIZONTAL DEPTH-AWARE OPTICAL TILT-SHIFT BLUR ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.blurFBO);
    gl.viewport(0, 0, this.lowW, this.lowH);
    gl.useProgram(this.progBlur);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.sceneTex);
    gl.uniform1i(this.uBlur.uScene, 0);
    gl.uniform2f(this.uBlur.uLowRes, this.lowW, this.lowH);
    gl.uniform1f(this.uBlur.uFocusDepth, this.focusDepth);
    gl.uniform1f(this.uBlur.uFocusY, this.focusY);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // ---- PASS 3: VERTICAL TILT-SHIFT + SHARP FOCAL BAND + FILMIC sRGB + BAYER DITHER + GRAIN ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.useProgram(this.progPost);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.sceneTex);
    gl.uniform1i(this.uPost.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.blurTex);
    gl.uniform1i(this.uPost.uBlurH, 1);
    gl.uniform2f(this.uPost.uLowRes, this.lowW, this.lowH);
    gl.uniform1f(this.uPost.uFocusDepth, this.focusDepth);
    gl.uniform1f(this.uPost.uFocusY, this.focusY);
    gl.uniform1f(this.uPost.uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  _updateHUD() {
    const full = `<svg class="heart-icon" viewBox="0 0 11 10">
      <rect x="1" y="1" width="3" height="1" fill="#8f1e24"/><rect x="7" y="1" width="3" height="1" fill="#8f1e24"/>
      <rect x="0" y="2" width="5" height="3" fill="#c93138"/><rect x="6" y="2" width="5" height="3" fill="#c93138"/>
      <rect x="5" y="3" width="1" height="2" fill="#c93138"/><rect x="2" y="2" width="2" height="1" fill="#f07872"/>
      <rect x="1" y="5" width="9" height="2" fill="#b3242b"/><rect x="2" y="7" width="7" height="1" fill="#8f1e24"/>
      <rect x="4" y="8" width="3" height="1" fill="#6b151a"/><rect x="5" y="9" width="1" height="1" fill="#6b151a"/>
    </svg>`;
    const half = `<svg class="heart-icon" viewBox="0 0 11 10">
      <rect x="1" y="1" width="3" height="1" fill="#8f1e24"/><rect x="7" y="1" width="3" height="1" fill="#2c3340"/>
      <rect x="0" y="2" width="5" height="3" fill="#c93138"/><rect x="6" y="2" width="5" height="3" fill="#232934"/>
      <rect x="5" y="3" width="1" height="2" fill="#232934"/><rect x="2" y="2" width="2" height="1" fill="#f07872"/>
      <rect x="1" y="5" width="5" height="2" fill="#b3242b"/><rect x="6" y="5" width="4" height="2" fill="#232934"/>
      <rect x="2" y="7" width="4" height="1" fill="#8f1e24"/><rect x="6" y="7" width="3" height="1" fill="#1b2029"/>
      <rect x="4" y="8" width="2" height="1" fill="#6b151a"/><rect x="6" y="8" width="1" height="1" fill="#1b2029"/>
      <rect x="5" y="9" width="1" height="1" fill="#6b151a"/>
    </svg>`;
    const empty = `<svg class="heart-icon" viewBox="0 0 11 10">
      <rect x="1" y="1" width="3" height="1" fill="#2f3745"/><rect x="7" y="1" width="3" height="1" fill="#2f3745"/>
      <rect x="0" y="2" width="5" height="3" fill="#222833"/><rect x="6" y="2" width="5" height="3" fill="#222833"/>
      <rect x="5" y="3" width="1" height="2" fill="#222833"/><rect x="1" y="5" width="9" height="2" fill="#1c212b"/>
      <rect x="2" y="7" width="7" height="1" fill="#171b24"/><rect x="4" y="8" width="3" height="1" fill="#141820"/>
      <rect x="5" y="9" width="1" height="1" fill="#141820"/>
    </svg>`;
    let html = '';
    for (let i = 0; i < Math.ceil(this.stats.maxHp / 2); i++) {
      const rem = this.stats.hp - i * 2;
      html += rem >= 2 ? full : (rem === 1 ? half : empty);
    }
    this.elHearts.innerHTML = html;
    this.elPotions.textContent = String(this.stats.potions);
    this.elKey.classList.toggle('active', this.stats.hasKey);
    this.elGold.textContent = String(this.stats.gold);
    this.elDepth.textContent = String(this.stats.depth);
    this.elSlain.textContent = String(this.stats.slain);
  }

  _loop(now) {
    requestAnimationFrame((ts) => this._loop(ts));
    const dt = Math.min((now - this.lastTime) / 1000, 0.05);
    this.lastTime = now;
    this._update(dt);
    this._render();
  }
}

window.__game = new TorchlightDepthsShaderEngine();
})();
</script>
</body>
</html>
